[package]
name = "zgltvpn"
version = "0.1.0"
description = "ZGLTVPN Windows 客户端"
authors = ["ZGLTVPN"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
