# ZGLTVPN Android build: fork of sing-box-for-android (SFA).
#
# Pipeline (mirrors the upstream sing-box release build):
#   1. build-libbox: build libbox.aar + libbox-legacy.aar from the sing-box
#      core (v1.15.0-alpha.13, matching the SFA dev snapshot in android/)
#      for each of the 4 Android ABIs.
#   2. build-apk: merge the per-ABI AARs, copy them to android/app/libs,
#      and run Gradle :app:assembleOtherRelease (the "other" flavor is the
#      GitHub/F-Droid flavor, no Play dependencies).
#
# Signing uses the repo secrets (see android/README-ZGLTVPN.md):
#   ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
# The keystore is decoded to android/app/release.keystore at build time and
# is never committed.

name: Android

on:
  push:
    branches: [android]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-libbox:
    name: Build libbox (${{ matrix.go_arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        go_arch: ["386", "amd64", "arm", "arm64"]
    steps:
      - name: Checkout sing-box core
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: SagerNet/sing-box
          ref: v1.15.0-alpha.13
          fetch-depth: 1
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-linux-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-linux-
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
      - name: Setup OpenJDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
      - name: Build library
        run: |-
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform android/${{ matrix.go_arch }}
          mkdir -p dist/${{ matrix.go_arch }}
          mv libbox.aar libbox-legacy.aar dist/${{ matrix.go_arch }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Upload library
        uses: actions/upload-artifact@v4
        with:
          name: libbox-android-${{ matrix.go_arch }}
          path: dist
          compression-level: 0

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: build-libbox
    steps:
      - name: Checkout zgltvpn-client
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
      - name: Checkout sing-box core (merge_aar tool)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          repository: SagerNet/sing-box
          ref: v1.15.0-alpha.13
          fetch-depth: 1
          path: sing-box-src
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false
      - name: Cache Go modules
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-linux-${{ hashFiles('sing-box-src/go.sum') }}
          restore-keys: go-mod-linux-
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
      - name: Setup OpenJDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
      - name: Download libraries
        uses: actions/download-artifact@v4
        with:
          pattern: libbox-android-*
          path: libbox-inputs
          merge-multiple: true
      - name: Merge libraries
        working-directory: sing-box-src
        run: |-
          go run ./cmd/internal/merge_aar -output ../libbox.aar ../libbox-inputs/*/libbox.aar
          go run ./cmd/internal/merge_aar -output ../libbox-legacy.aar ../libbox-inputs/*/libbox-legacy.aar
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          build-root-directory: android
          cache-provider: basic
      - name: Prepare signing
        run: |-
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          printf 'KEYSTORE_PASS=%s\nALIAS_NAME=%s\nALIAS_PASS=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" \
            "${{ secrets.KEY_PASSWORD }}" > android/local.properties
      - name: Build
        run: |-
          mkdir -p android/app/libs
          cp libbox.aar libbox-legacy.aar android/app/libs
          cd android
          ./gradlew --build-cache --parallel :app:assembleOtherRelease
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: zgltvpn-android-apks
          path: android/app/build/outputs/apk/other/release/*.apk
